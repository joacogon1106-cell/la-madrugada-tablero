// =============== Init ===============
function init() {
  document.getElementById('updated-date').textContent = DATA.generado_en;
  populateFilters();
  renderAll();
  computeKPIs();
  setupMonitoreo();

  // Tabs
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.view = btn.dataset.view;
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.view').forEach(v => {
        v.classList.toggle('active', v.id === 'view-' + state.view);
      });
      // Ocultar los filtros del tablero principal en Monitoreo y Planos (no aplican ahí)
      const mainFilters = document.getElementById('filters');
      if (mainFilters) mainFilters.style.display = (state.view === 'monitoreo' || state.view === 'planos') ? 'none' : '';
      // Cargar monitoreos al entrar por primera vez
      if (state.view === 'monitoreo') loadMonitoreo(false);
      // Inicializar mapa al entrar por primera vez a Planos
      // (y llamar invalidateSize para que redibuje bien si el contenedor cambió de tamaño)
      if (state.view === 'planos') {
        initPlanosMapa();
        if (PLANOS_STATE.mapa) {
          setTimeout(() => PLANOS_STATE.mapa.invalidateSize(), 100);
          setTimeout(() => PLANOS_STATE.mapa.invalidateSize(), 400);
        }
      }
    });
  });

  // Filtros
  document.getElementById('filter-campana').addEventListener('change', e => { state.filter.campana = e.target.value; renderAll(); });
  document.getElementById('filter-est').addEventListener('change', e => { state.filter.est = e.target.value; renderAll(); });
  document.getElementById('filter-cultivo').addEventListener('change', e => { state.filter.cultivo = e.target.value; renderAll(); });
  document.getElementById('filter-tipo').addEventListener('change', e => { state.filter.tipo = e.target.value; renderAll(); });
  document.getElementById('filter-clear').addEventListener('click', () => {
    state.filter = { campana: '', est: '', cultivo: '', tipo: '' };
    document.querySelectorAll('.filter-select').forEach(s => s.value = '');
    renderAll();
  });

  // Modal
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target.id === 'modal-backdrop') closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeInformeConfig(); }
    // Navegación con flechas solo cuando el modal está abierto en la vista Monitoreo
    const modalOpen = document.getElementById('modal-backdrop').classList.contains('active');
    if (modalOpen && state.view === 'monitoreo' && monNavList.length) {
      if (e.key === 'ArrowLeft' && monNavCurrent > 0) openMonitoreoModal(monNavCurrent - 1);
      if (e.key === 'ArrowRight' && monNavCurrent < monNavList.length - 1) openMonitoreoModal(monNavCurrent + 1);
    }
  });
}

function populateFilters() {
  // Recolectar campañas de ambas fuentes (órdenes + planificación)
  const campanasSet = new Set();
  DATA.ordenes_trabajo.forEach(o => { if (o.campaña) campanasSet.add(o.campaña); });
  DATA.lotes.forEach(l => {
    if (l.campaña_planificada) campanasSet.add(l.campaña_planificada);
  });
  // Ordenar campañas (formato XX-YY) descendente
  const campanas = [...campanasSet].sort((a, b) => b.localeCompare(a));

  const selCampana = document.getElementById('filter-campana');
  campanas.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = 'Campaña ' + c;
    selCampana.appendChild(opt);
  });

  const ests = [...new Set(DATA.lotes.map(l => l.establecimiento))].sort();
  const selEst = document.getElementById('filter-est');
  ests.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e;
    opt.textContent = e.replace('_', ' ');
    selEst.appendChild(opt);
  });

  const cultivos = [...new Set(DATA.lotes.map(l => l.cultivo_actual).filter(Boolean))].sort();
  const selCult = document.getElementById('filter-cultivo');
  cultivos.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    selCult.appendChild(opt);
  });

  const tipos = [...new Set(DATA.ordenes_trabajo.map(o => o.tipo_labor))].sort();
  const selTipo = document.getElementById('filter-tipo');
  tipos.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    selTipo.appendChild(opt);
  });
}

function computeKPIs() {
  const { lotes, ordenes } = applyFilters(DATA.lotes, DATA.ordenes_trabajo);
  const supTotal = lotes.reduce((s, l) => s + (l.superficie || 0), 0);
  const cultivosUnicos = new Set(lotes.map(l => l.cultivo_actual).filter(Boolean));
  const estUnicos = new Set(lotes.map(l => l.establecimiento));

  document.getElementById('kpi-lotes').textContent = lotes.length;
  document.getElementById('kpi-ha').innerHTML = Math.round(supTotal) + '<span class="unit">ha</span>';
  document.getElementById('kpi-cultivos').textContent = cultivosUnicos.size + ' cultivos distintos';
  document.getElementById('kpi-est').textContent = estUnicos.size;
}

function applyFilters(lotes, ordenes) {
  const f = state.filter;
  const showClear = f.campana || f.est || f.cultivo || f.tipo;
  document.getElementById('filter-clear').style.display = showClear ? 'inline' : 'none';

  let filteredLotes = lotes.filter(l => {
    if (f.est && l.establecimiento !== f.est) return false;
    if (f.cultivo && l.cultivo_actual !== f.cultivo) return false;
    if (f.campana) {
      const tieneCampana = (l.ordenes_trabajo || []).some(o => o.campaña === f.campana) ||
                          l.campaña_planificada === f.campana;
      if (!tieneCampana) return false;
    }
    if (f.tipo) {
      const tieneTipo = (l.ordenes_trabajo || []).some(o => o.tipo_labor === f.tipo);
      if (!tieneTipo) return false;
    }
    return true;
  });

  let filteredOrdenes = ordenes.filter(o => {
    if (f.campana && o.campaña !== f.campana) return false;
    if (f.est && o.establecimiento !== f.est) return false;
    if (f.cultivo && o.cultivo !== f.cultivo) return false;
    if (f.tipo && o.tipo_labor !== f.tipo) return false;
    return true;
  });

  return { lotes: filteredLotes, ordenes: filteredOrdenes };
}

function renderAll() {
  const { lotes, ordenes } = applyFilters(DATA.lotes, DATA.ordenes_trabajo);
  document.getElementById('count-lotes').textContent = lotes.length;
  document.getElementById('count-trat').textContent = ordenes.length;
  renderLotes(lotes);
  renderTratamientos(ordenes);
  computeKPIs();
}

// =============== Render Lotes ===============
const TIPOS_LABOR = ['Siembra', 'Fertilización', 'Pulverización', 'Cosecha'];

function detalleLabor(orden) {
  if (!orden || !orden.items) return '';
  // Filtrar productos relevantes (no coadyuvantes ni el "pulvT" placeholder)
  const principales = orden.items
    .filter(i => i.tipo && i.tipo !== 'Coadyuvante' && i.tipo !== 'Labor')
    .map(i => i.producto);
  if (principales.length === 0) return '';
  if (principales.length <= 2) return principales.join(' · ');
  return principales.slice(0, 2).join(' · ') + ' + ' + (principales.length - 2);
}

function renderLotes(lotes) {
  const grid = document.getElementById('lotes-grid');
  if (lotes.length === 0) {
    grid.innerHTML = '<div class="empty"><div class="empty-title">Sin resultados</div><div class="empty-sub">Probá quitando algún filtro</div></div>';
    return;
  }

  const byEst = {};
  lotes.forEach(l => { (byEst[l.establecimiento] = byEst[l.establecimiento] || []).push(l); });

  let html = '';
  Object.keys(byEst).sort().forEach(est => {
    html += '<div style="grid-column: 1/-1;" class="section-label">' + est.replace('_', ' ') + ' &nbsp;·&nbsp; ' + byEst[est].length + ' lotes</div>';

    byEst[est].sort((a, b) => a.lote.localeCompare(b.lote)).forEach(l => {
      const cultivo = l.cultivo_actual || '—';
      const cultivoNombre = cultivoConDestino(cultivo, l.destino_actual);
      const color = cultivoColor(cultivo);

      // Si tiene ambientes, generar lista compacta agrupada por cultivo
      let ambientesHtml = '';
      let analisis = null;
      if (l.tiene_ambientes && l.ambientes && l.ambientes.length > 0) {
        analisis = analizarAmbientes(l.ambientes);
        ambientesHtml = '<div class="ambientes-mini">';
        analisis.grupos_cultivo.forEach(g => {
          const cColor = cultivoColor(g.cultivo);
          ambientesHtml += `
            <div class="ambiente-mini-row">
              <span class="ambiente-mini-cultivo">
                <span style="color: ${cColor}; display:inline-flex;">${cultivoSvg(g.cultivo, 14)}</span>
                ${g.nombre}
              </span>
              <span class="ambiente-mini-sup">${g.superficie.toFixed(1).replace(/\.0$/, '')} ha</span>
            </div>
          `;
        });
        ambientesHtml += '</div>';
      }

      // Buscar última labor de cada tipo
      let laboresHtml = '';
      let totalLabores = 0;
      TIPOS_LABOR.forEach(tipo => {
        const ult = ultimaPorTipo(l, tipo);
        if (!ult) return;
        totalLabores++;
        const dias = diffDays(ult.fecha);
        const detalle = detalleLabor(ult);
        laboresHtml += `
          <div class="labor-row">
            <div class="labor-tipo">${tipo}</div>
            <div class="labor-fecha">${formatDateNumeric(ult.fecha)}</div>
            <div class="labor-badge"><span class="dias-badge ${diasBadgeClass(dias)}">${diasText(dias)}</span></div>
            ${detalle ? `<div class="labor-detalle">${detalle}</div>` : ''}
          </div>
        `;
      });

      // Si no hay ninguna labor, mostrar planificación si existe
      if (totalLabores === 0) {
        if (l.fecha_siembra_planificada || l.genetica) {
          laboresHtml = `
            <div class="labor-row">
              <div class="labor-tipo">Planificado</div>
              <div class="labor-fecha">${l.fecha_siembra_planificada ? formatDateNumeric(l.fecha_siembra_planificada) : '—'}</div>
              <div class="labor-badge"><span class="dias-badge futuro">siembra</span></div>
              ${l.genetica ? `<div class="labor-detalle">${l.genetica}${l.fertilizante_p ? ' · ' + l.fertilizante_p : ''}</div>` : ''}
            </div>
          `;
        } else {
          laboresHtml = '<div class="labores-empty">Sin labores cargadas<span class="small">cuando se carguen aparecerán acá</span></div>';
        }
      }

      // Indicador de ambientes en lugar de ambiente único
      let cultivoRowExtra = '';
      if (l.tiene_ambientes) {
        cultivoRowExtra = `<span class="ambientes-badge">${l.n_ambientes} ambientes</span>`;
      } else if (l.ambientes && l.ambientes.length === 1 && l.ambientes[0].ambiente) {
        cultivoRowExtra = `<span class="ambiente-tag">${l.ambientes[0].ambiente}</span>`;
      }

      html += `
        <div class="lote-card" style="--cultivo-color: ${color}" data-est="${est}" data-lote="${l.lote}">
          <div class="lote-head">
            <div>
              <div class="lote-codigo">${l.lote}</div>
              <div class="lote-establecimiento">${est.replace('_',' ')}</div>
            </div>
            <div class="lote-superficie">${l.superficie || 0}<span class="unit">ha</span></div>
          </div>
          <div class="lote-cultivo-row">
            <span class="cultivo-icon" style="color: ${color}">${cultivoSvg(cultivo, 22)}</span>
            <span class="cultivo-nombre">${cultivoNombre}</span>
            ${cultivoRowExtra}
          </div>
          ${ambientesHtml}
          <div class="labores-list">${laboresHtml}</div>
        </div>
      `;
    });
  });

  grid.innerHTML = html;
  grid.querySelectorAll('.lote-card').forEach(card => {
    card.addEventListener('click', () => {
      openLoteModal(card.dataset.est, card.dataset.lote);
    });
  });
}

// =============== Render Tratamientos ===============
function renderTratamientos(ordenes) {
  const cont = document.getElementById('tratamientos-list');
  if (ordenes.length === 0) {
    cont.innerHTML = '<div class="empty"><div class="empty-title">Sin tratamientos</div><div class="empty-sub">Probá ajustando los filtros</div></div>';
    return;
  }

  let html = '';
  ordenes.forEach((o, idx) => {
    const fp = formatDateParts(o.fecha);
    const tipoClass = (o.tipo_labor || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const colorCultivo = cultivoColor(o.cultivo);
    html += `
      <div class="tratamiento-card" data-idx="${idx}">
        <div class="tratamiento-header">
          <div class="tratamiento-fecha-block">
            <div class="fecha-dia">${fp.dia}</div>
            <div class="fecha-mes">${fp.mes}</div>
            <div class="fecha-anio">${fp.anio}</div>
          </div>
          <div class="tratamiento-info-main">
            <div class="tratamiento-titulo">
              <span class="codigo">${o.lote}</span>
              <span class="establecimiento">· ${o.establecimiento.replace('_',' ')}</span>
            </div>
            <div class="tratamiento-meta">
              <span class="labor-tag ${tipoClass}">${o.tipo_labor}</span>
              <span class="cultivo-with-icon" style="color: ${colorCultivo}">
                ${cultivoSvg(o.cultivo, 16)}<span style="color: var(--ink-3)">${o.cultivo}</span>
              </span>
              <span>${o.superficie} ha</span>
              <span>${o.n_productos} ${o.n_productos === 1 ? 'producto' : 'productos'}</span>
            </div>
          </div>
          <div class="expand-icon">›</div>
        </div>
        <div class="tratamiento-body">
          ${renderItemsTable(o.items)}
        </div>
      </div>
    `;
  });

  cont.innerHTML = html;
  cont.querySelectorAll('.tratamiento-header').forEach(h => {
    h.addEventListener('click', () => h.parentElement.classList.toggle('expanded'));
  });
}

function renderItemsTable(items) {
  if (!items || items.length === 0) return '<p style="padding: 12px 0; color: var(--ink-3);">Sin productos cargados</p>';
  let rows = '';
  items.forEach(i => {
    const tipoClass = (i.tipo || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    rows += `
      <tr>
        <td>
          <div class="producto-cell">${i.producto}</div>
        </td>
        <td><span class="tipo-pill ${tipoClass}">${i.tipo}</span></td>
        <td class="dosis-cell">${i.dosis !== null ? i.dosis : '—'} ${i.unidad || ''}</td>
        <td class="total-cell col-total">${i.total !== null ? i.total.toFixed(1) : '—'}</td>
      </tr>
    `;
  });
  return `
    <table class="items-table">
      <thead>
        <tr>
          <th>Producto</th>
          <th class="col-pa">Tipo</th>
          <th style="text-align:right;">Dosis/ha</th>
          <th class="col-total" style="text-align:right;">Total</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

// =============== Render Cronología ===============
function renderCronologia(ordenes) {
  const cont = document.getElementById('timeline');
  if (ordenes.length === 0) {
    cont.innerHTML = '<div class="empty"><div class="empty-title">Sin labores</div></div>';
    return;
  }

  let html = '';
  ordenes.forEach(o => {
    const tipoClass = (o.tipo_labor || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const principales = (o.items || []).filter(i => i.tipo !== 'Labor' && i.tipo !== 'Coadyuvante').slice(0, 3).map(i => i.producto).join(' · ');
    html += `
      <div class="timeline-item ${tipoClass}">
        <div class="timeline-fecha">${formatDateShort(o.fecha)} · ${diasText(diffDays(o.fecha))}</div>
        <div class="timeline-titulo">${o.tipo_labor} en ${o.lote}</div>
        <div class="timeline-desc">
          ${o.establecimiento.replace('_',' ')} · ${o.cultivo} · ${o.superficie} ha
          ${principales ? '<br>' + principales : ''}
        </div>
      </div>
    `;
  });

  cont.innerHTML = html;
}

// =============== Modal ===============
function openLoteModal(est, loteCode) {
  const lote = DATA.lotes.find(l => l.establecimiento === est && l.lote === loteCode);
  if (!lote) return;

  const inner = document.getElementById('modal-inner');
  const cultivo = lote.cultivo_actual || '—';
  const cultivoNombre = cultivoConDestino(cultivo, lote.destino_actual);
  const color = cultivoColor(cultivo);

  let ordenesHtml = '';
  if (lote.ordenes_trabajo && lote.ordenes_trabajo.length > 0) {
    lote.ordenes_trabajo.forEach(o => {
      ordenesHtml += `
        <div class="orden-mini">
          <div class="orden-mini-head">
            <span class="orden-mini-fecha">${formatDateShort(o.fecha)} · ${o.tipo_labor}</span>
            <span class="dias-badge ${diasBadgeClass(diffDays(o.fecha))}">${diasText(diffDays(o.fecha))}</span>
          </div>
          <div class="orden-mini-items">
            ${o.items.map(i => `
              <div class="producto-line">
                <span>${i.producto}</span>
                <span class="dosis-mini">${i.dosis !== null ? i.dosis : ''} ${i.unidad || ''}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    });
  } else {
    ordenesHtml = '<p style="color: var(--ink-3); font-style: italic; padding: 12px 0;">No hay órdenes de trabajo registradas para este lote.</p>';
  }

  // Análisis de ambientes para detectar comunes vs variables
  const analisis = lote.tiene_ambientes ? analizarAmbientes(lote.ambientes) : null;
  const fertPResumen = analisis ? formatFertResumen(analisis.fert_p) : null;
  const fertNResumen = analisis ? formatFertResumen(analisis.fert_n) : null;

  let planificacionHtml = '';

  // Si tiene ambientes múltiples, mostrar 2 secciones
  if (lote.tiene_ambientes && lote.ambientes && lote.ambientes.length > 0) {

    // === Sección 1: Superficie por genética ===
    if (analisis.grupos_genetica && analisis.grupos_genetica.length > 0) {
      // Helper para resumir fechas de un grupo
      function resumenFechas(fechas) {
        if (!fechas || fechas.length === 0) return '—';
        const unicas = [...new Set(fechas)].sort();
        if (unicas.length === 1) return formatDateShort(unicas[0]);
        // Rango: primera y última
        return formatDateShort(unicas[0]) + ' – ' + formatDateShort(unicas[unicas.length - 1]);
      }
      let rowsGen = '';
      analisis.grupos_genetica.forEach(g => {
        rowsGen += `
          <tr>
            <td style="font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; color: var(--ink); padding: 12px 10px 12px 0;">${g.genetica}</td>
            <td class="amb-sup">${g.superficie.toFixed(1).replace(/\.0$/,'')} ha</td>
            <td class="amb-extra">${resumenFechas(g.fechas)}</td>
          </tr>
        `;
      });
      planificacionHtml += `
        <div class="modal-section-title">Superficie por genética</div>
        <table class="ambientes-table">
          <thead>
            <tr>
              <th>Genética</th>
              <th style="text-align:right;">Superficie</th>
              <th>Fecha de siembra</th>
            </tr>
          </thead>
          <tbody>${rowsGen}</tbody>
        </table>
      `;
    }

    // === Sección 2: Ambientación ===
    // Agrupar por nombre de ambiente (Media Loma 2 puede aparecer 2 veces con cultivos distintos)
    const ambientesAgrupados = {};
    lote.ambientes.forEach(amb => {
      const key = amb.ambiente || '—';
      if (!ambientesAgrupados[key]) {
        ambientesAgrupados[key] = { ambiente: key, sub: [] };
      }
      ambientesAgrupados[key].sub.push(amb);
    });

    // Para cada grupo, calcular: superficie total, y resumir Fert N / Fert P / Densidad
    const ambientesFinales = Object.values(ambientesAgrupados).map(g => {
      const supTotal = g.sub.reduce((s, a) => s + (a.superficie || 0), 0);
      const fertN = analizar(g.sub, 'fertilizante_n', 'dosis_fert_n', 'kg/ha');
      const fertP = analizar(g.sub, 'fertilizante_p', 'dosis_fert_p', 'kg/ha');
      // Densidad: solo si algún cultivo del grupo es maíz/girasol
      const subConDensidad = g.sub.filter(a => {
        const k = cultivoKey(a.cultivo);
        return (k === 'maiz' || k === 'girasol') && a.densidad_recomendada;
      });
      let densidad = '—';
      if (subConDensidad.length > 0) {
        const valores = subConDensidad.map(a => a.densidad_recomendada);
        const unicos = [...new Set(valores)];
        if (unicos.length === 1) densidad = valores[0] + ' pl/m²';
        else densidad = Math.round(valores.reduce((s,v)=>s+v,0)/valores.length) + ' pl/m²';
      }
      return { ambiente: g.ambiente, superficie: supTotal, fert_n: fertN, fert_p: fertP, densidad };
    });

    // Determinar qué columnas mostrar
    const showFertP = analisis.fert_p && (analisis.fert_p.variable || analisis.fert_p.promedio);
    const showDensidad = analisis.requiere_densidad;

    let headerCols = '<th>Ambiente</th><th style="text-align:right;">Sup.</th><th>Fert. nitrógeno</th>';
    if (showFertP) headerCols += '<th>Fert. fósforo</th>';
    if (showDensidad) headerCols += '<th style="text-align:right;">Densidad</th>';

    function fertCellText(info) {
      if (!info) return '—';
      if (info.variable) return 'Variable';
      if (info.uniforme) {
        return info.producto + (info.dosis != null ? ' · ' + info.dosis + ' kg/ha' : '');
      }
      if (info.promedio) {
        return info.producto + ' · prom. ' + info.dosis + ' kg/ha';
      }
      return '—';
    }

    let rowsAmb = '';
    ambientesFinales.forEach(amb => {
      let row = `
        <td class="amb-nombre">${amb.ambiente}</td>
        <td class="amb-sup">${amb.superficie.toFixed(1).replace(/\.0$/,'')} ha</td>
        <td class="amb-extra">${fertCellText(amb.fert_n)}</td>
      `;
      if (showFertP) row += `<td class="amb-extra">${fertCellText(amb.fert_p)}</td>`;
      if (showDensidad) row += `<td class="amb-extra" style="text-align:right; font-family: 'JetBrains Mono', monospace;">${amb.densidad}</td>`;
      rowsAmb += `<tr>${row}</tr>`;
    });

    planificacionHtml += `
      <div class="modal-section-title">Ambientación · ${ambientesFinales.length} ambientes</div>
      <table class="ambientes-table">
        <thead><tr>${headerCols}</tr></thead>
        <tbody>${rowsAmb}</tbody>
      </table>
    `;

  } else if (lote.fecha_siembra_planificada || lote.semillero || lote.genetica || lote.fertilizante_p) {
    // Lote sin ambientes pero con planificación general
    planificacionHtml = `
      <div class="modal-section-title">Planificación campaña ${lote.campaña_planificada || ''}</div>
      <dl class="planificacion-row">
        ${lote.fecha_siembra_planificada ? `<dt>Fecha siembra</dt><dd>${formatDateShort(lote.fecha_siembra_planificada)}</dd>` : ''}
        ${lote.semillero ? `<dt>Semillero</dt><dd>${lote.semillero}</dd>` : ''}
        ${lote.genetica ? `<dt>Genética</dt><dd>${lote.genetica}</dd>` : ''}
        ${lote.fertilizante_p ? `<dt>Fert. fósforo</dt><dd>${lote.fertilizante_p}${lote.dosis_fert_p ? ' · ' + lote.dosis_fert_p + ' kg/ha' : ''}</dd>` : ''}
        ${lote.fertilizante_n ? `<dt>Fert. nitrógeno</dt><dd>${lote.fertilizante_n}${lote.dosis_fert_n ? ' · ' + Math.round(lote.dosis_fert_n) + ' kg/ha' : ''}</dd>` : ''}
      </dl>
    `;
  }

  inner.innerHTML = `
    <div class="modal-header" style="border-left: 3px solid ${color}; padding-left: 16px;">
      <div class="modal-codigo">${lote.lote}</div>
      <div class="modal-establecimiento">${est.replace('_',' ')}</div>
      <div class="modal-stats">
        <div class="modal-stat">
          <div class="modal-stat-label">Cultivo</div>
          <div class="modal-stat-value" style="display:flex; align-items:center; gap:6px;">
            <span style="color: ${color}; display:inline-flex;">${cultivoSvg(cultivo, 18)}</span>
            ${cultivoNombre}
          </div>
        </div>
        <div class="modal-stat">
          <div class="modal-stat-label">Superficie</div>
          <div class="modal-stat-value">${lote.superficie || '—'} <span class="small">ha</span></div>
        </div>
        ${lote.antecesor && lote.antecesor !== '—' ? `
          <div class="modal-stat">
            <div class="modal-stat-label">Antecesor</div>
            <div class="modal-stat-value">${lote.antecesor}</div>
          </div>` : ''}
        ${fertPResumen ? `
          <div class="modal-stat">
            <div class="modal-stat-label">Fert. fósforo</div>
            <div class="modal-stat-value" style="font-size: 14px;">${fertPResumen}</div>
          </div>` : ''}
      </div>
    </div>

    ${planificacionHtml}

    <div class="modal-section-title">Órdenes de trabajo · ${(lote.ordenes_trabajo || []).length}</div>
    ${ordenesHtml}
  `;

  document.getElementById('modal-backdrop').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('active');
  document.body.style.overflow = '';
}

// SVG icons por código WMO de Open-Meteo
// https://open-meteo.com/en/docs#weathervariables
function weatherSvg(code, isDay) {
  // Soleado
  if (code === 0) return `<svg viewBox="0 0 32 32" width="32" height="32"><circle cx="16" cy="16" r="6" fill="#E5A845"/><g stroke="#E5A845" stroke-width="1.8" stroke-linecap="round"><line x1="16" y1="3" x2="16" y2="6"/><line x1="16" y1="26" x2="16" y2="29"/><line x1="3" y1="16" x2="6" y2="16"/><line x1="26" y1="16" x2="29" y2="16"/><line x1="7" y1="7" x2="9" y2="9"/><line x1="23" y1="23" x2="25" y2="25"/><line x1="7" y1="25" x2="9" y2="23"/><line x1="23" y1="9" x2="25" y2="7"/></g></svg>`;
  // Parcialmente nublado
  if (code === 1 || code === 2) return `<svg viewBox="0 0 32 32" width="32" height="32"><circle cx="11" cy="12" r="5" fill="#E5A845"/><path d="M 9 22 Q 6 22 6 19 Q 6 17 9 17 Q 10 13 14 13 Q 19 13 20 17 Q 24 17 24 21 Q 24 24 21 24 L 10 24 Q 9 24 9 22 Z" fill="#B5B5B0" stroke="#8B8B85" stroke-width="0.8"/></svg>`;
  // Nublado
  if (code === 3) return `<svg viewBox="0 0 32 32" width="32" height="32"><path d="M 8 20 Q 5 20 5 17 Q 5 15 8 15 Q 9 11 13 11 Q 18 11 19 15 Q 23 15 23 19 Q 23 22 20 22 L 9 22 Q 8 22 8 20 Z" fill="#B5B5B0" stroke="#7B7B75" stroke-width="0.8"/><path d="M 14 24 Q 11 24 11 21 Q 11 19 14 19 Q 15 15 19 15 Q 24 15 25 19 Q 29 19 29 23 Q 29 26 26 26 L 15 26 Q 14 26 14 24 Z" fill="#9B9B95" stroke="#6B6B65" stroke-width="0.8"/></svg>`;
  // Niebla
  if (code === 45 || code === 48) return `<svg viewBox="0 0 32 32" width="32" height="32"><g stroke="#9B9B95" stroke-width="2" stroke-linecap="round" fill="none"><line x1="5" y1="11" x2="27" y2="11"/><line x1="3" y1="16" x2="22" y2="16"/><line x1="9" y1="21" x2="29" y2="21"/><line x1="5" y1="26" x2="25" y2="26"/></g></svg>`;
  // Llovizna
  if (code >= 51 && code <= 57) return `<svg viewBox="0 0 32 32" width="32" height="32"><path d="M 7 14 Q 4 14 4 11 Q 4 9 7 9 Q 8 5 12 5 Q 17 5 18 9 Q 22 9 22 13 Q 22 16 19 16 L 8 16 Q 7 16 7 14 Z" fill="#9B9B95"/><g stroke="#4A8BC2" stroke-width="1.5" stroke-linecap="round"><line x1="10" y1="20" x2="9" y2="24"/><line x1="16" y1="20" x2="15" y2="24"/><line x1="22" y1="20" x2="21" y2="24"/></g></svg>`;
  // Lluvia
  if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return `<svg viewBox="0 0 32 32" width="32" height="32"><path d="M 7 13 Q 4 13 4 10 Q 4 8 7 8 Q 8 4 12 4 Q 17 4 18 8 Q 22 8 22 12 Q 22 15 19 15 L 8 15 Q 7 15 7 13 Z" fill="#6B7B85"/><g stroke="#2A6BB2" stroke-width="2" stroke-linecap="round"><line x1="9" y1="19" x2="7" y2="26"/><line x1="14" y1="19" x2="12" y2="26"/><line x1="19" y1="19" x2="17" y2="26"/><line x1="24" y1="19" x2="22" y2="26"/></g></svg>`;
  // Nieve
  if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return `<svg viewBox="0 0 32 32" width="32" height="32"><path d="M 7 13 Q 4 13 4 10 Q 4 8 7 8 Q 8 4 12 4 Q 17 4 18 8 Q 22 8 22 12 Q 22 15 19 15 L 8 15 Q 7 15 7 13 Z" fill="#9B9B95"/><g fill="#88AAD5" font-family="serif" font-size="10"><text x="8" y="26">❄</text><text x="16" y="26">❄</text><text x="22" y="24">❄</text></g></svg>`;
  // Tormenta
  if (code >= 95) return `<svg viewBox="0 0 32 32" width="32" height="32"><path d="M 7 13 Q 4 13 4 10 Q 4 8 7 8 Q 8 4 12 4 Q 17 4 18 8 Q 22 8 22 12 Q 22 15 19 15 L 8 15 Q 7 15 7 13 Z" fill="#4B4B45"/><path d="M 14 18 L 11 25 L 14 25 L 12 30 L 19 22 L 16 22 L 18 18 Z" fill="#E5A845" stroke="#A07020" stroke-width="0.5"/></svg>`;
  return `<svg viewBox="0 0 32 32" width="32" height="32"><circle cx="16" cy="16" r="3" fill="#9B9B95"/></svg>`;
}

function windDirArrow(deg) {
  // Flecha que indica HACIA dónde sopla el viento. El viento sopla DESDE 'deg', entonces va hacia (deg+180)
  const direccion = (deg + 180) % 360;
  return `<span class="weather-wind-arrow" style="transform: rotate(${direccion}deg); display:inline-block;">↑</span>`;
}

async function loadWeather() {
  const cont = document.getElementById('weather-row');
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_CONFIG.lat}&longitude=${WEATHER_CONFIG.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant&timezone=auto&forecast_days=10&wind_speed_unit=kmh`;
  cont.innerHTML = '<div class="weather-loading">Cargando pronóstico…</div>';

  // Timeout de 8 segundos para evitar que quede colgado si una extensión
  // del navegador bloquea silenciosamente la petición
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 8000);

  try {
    const r = await fetch(url, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!r.ok) throw new Error('La API respondió con código ' + r.status);
    const data = await r.json();
    renderWeather(data);
  } catch (e) {
    clearTimeout(timeoutId);
    console.error('Error cargando pronóstico:', e);
    const esFileProtocol = window.location.protocol === 'file:';
    const esTimeout = e.name === 'AbortError';
    cont.innerHTML = `
      <div class="weather-error">
        <div style="font-size: 13px; color: var(--ink-2); margin-bottom: 10px;">
          ⚠ No se pudo cargar el pronóstico ${esTimeout ? '(timeout)' : ''}
        </div>
        ${esFileProtocol ? `
          <div style="font-size: 12px; line-height: 1.6; max-width: 620px; margin: 0 auto; color: var(--ink-3); text-align: left;">
            Estás abriendo el archivo directamente desde el disco (<code style="font-family: 'JetBrains Mono', monospace; background: var(--paper-3); padding: 1px 4px; border-radius: 3px;">file://</code>). Esto bloquea las llamadas al servicio de pronóstico, ya sea por restricciones del navegador o por una extensión instalada (AdGuard, uBlock, antivirus, etc.).
            <br><br>
            <strong style="color: var(--ink-2);">Solución definitiva — subir el archivo a un hosting (3 minutos, gratis):</strong>
            <br>① Abrí <a href="https://app.netlify.com/drop" target="_blank" style="color: var(--olive); font-weight: 500;">app.netlify.com/drop</a>
            <br>② Arrastrá el archivo HTML al recuadro de la página
            <br>③ Te genera un link tipo <code style="font-family: 'JetBrains Mono', monospace; background: var(--paper-3); padding: 1px 4px;">https://nombre-aleatorio.netlify.app</code>
            <br>④ Abrí ese link en cualquier navegador y el pronóstico carga
            <br><br>
            Ese mismo link te sirve para compartir la app con el dueño desde el celular o lo que sea.
          </div>
        ` : `
          <div style="font-size: 12px; color: var(--ink-3);">Verificá tu conexión a internet o desactivá temporalmente extensiones de bloqueo. Detalle: ${e.message}</div>
        `}
        <button onclick="loadWeather()" style="margin-top: 14px; padding: 6px 14px; background: var(--paper); border: 1px solid var(--olive); border-radius: 4px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--olive);">Reintentar</button>
      </div>
    `;
  }
}

function renderWeather(data) {
  const cont = document.getElementById('weather-row');
  const d = data.daily;
  if (!d || !d.time) {
    cont.innerHTML = `<div class="weather-error">Datos meteorológicos no disponibles.</div>`;
    return;
  }
  let cardsHtml = '';
  for (let i = 0; i < d.time.length && i < 10; i++) {
    const fecha = new Date(d.time[i] + 'T00:00:00');
    const isToday = i === 0;
    const tMax = Math.round(d.temperature_2m_max[i]);
    const tMin = Math.round(d.temperature_2m_min[i]);
    const lluvia = d.precipitation_sum[i] || 0;
    const probLluvia = d.precipitation_probability_max[i] || 0;
    const viento = Math.round(d.wind_speed_10m_max[i]);
    const dirViento = d.wind_direction_10m_dominant[i];
    const code = d.weather_code[i];

    const rainClass = lluvia < 0.5 ? 'dry' : '';
    const windClass = viento > 40 ? 'fuerte' : '';

    cardsHtml += `
      <div class="weather-day ${isToday ? 'today' : ''}">
        <div class="weather-dia">${isToday ? 'HOY' : DIAS_SEMANA[fecha.getDay()]}</div>
        <div class="weather-fecha">${fecha.getDate()} ${MESES_CORTOS[fecha.getMonth()]}</div>
        <div class="weather-icon">${weatherSvg(code, true)}</div>
        <div class="weather-temps">
          <span class="weather-tmax">${tMax}°</span>
          <span class="weather-tmin">${tMin}°</span>
        </div>
        <div class="weather-rain ${rainClass}" title="${probLluvia}% probabilidad">
          ${lluvia >= 0.5 ? `💧 ${lluvia.toFixed(lluvia < 10 ? 1 : 0)}mm` : '—'}
        </div>
        <div class="weather-wind ${windClass}">
          ${windDirArrow(dirViento)} ${viento}
        </div>
      </div>
    `;
  }

  cont.innerHTML = `
    <div class="weather-header">
      <span class="weather-label">Pronóstico 10 días</span>
      <span class="weather-location">${WEATHER_CONFIG.nombre}</span>
    </div>
    <div class="weather-grid">${cardsHtml}</div>
  `;
}

// ================= SOLAPA PLANOS =================
const PLANOS_STATE = { mapa: null, layers: {}, initialized: false };

// Colores por abreviatura de cultivo (matchea con los colores de la solapa Lotes)
const PLANOS_COLORS_ABREV = {
  'mz':      '#C49340',
  'mzt':     '#B5832F',
  'sj':      '#5E8541',
  'sj1':     '#5E8541',
  'sj2':     '#7BA354',
  'gi':      '#E0A030',
  'ce':      '#C8A858',
  'ce/sj2':  '#8A7040',
  'tr':      '#C8A858',
  'av':      '#C8A858',
  'cen':     '#C8A858',
  'sor':     '#A85A3D',
  'pp':      '#7A8B5C',
  'pn':      '#7A8B5C'
};

// Nombre legible desde la abreviatura (usa el diccionario global si existe)
function planosCultivoNombre(abrev) {
  if (!abrev) return '—';
  if (typeof DATA !== 'undefined' && DATA.cultivos_dict && DATA.cultivos_dict[abrev]) {
    return DATA.cultivos_dict[abrev];
  }
  const fallback = {
    'mz': 'Maíz', 'mzt': 'Maíz Tardío',
    'sj': 'Soja', 'sj1': 'Soja 1ra', 'sj2': 'Soja 2da',
    'gi': 'Girasol', 'ce': 'Cebada', 'ce/sj2': 'Cebada / Soja 2da',
    'tr': 'Trigo', 'av': 'Avena', 'cen': 'Centeno',
    'sor': 'Sorgo', 'pp': 'Pastura', 'pn': 'Pastura natural'
  };
  return fallback[abrev] || abrev;
}

function planosColorPoligono(abrev) {
  return PLANOS_COLORS_ABREV[abrev] || '#95A695';
}

function estiloPoligonoPlano(feature) {
  const p = feature.properties;
  if (!p.es_agricola) {
    return { color: '#666', weight: 1.5, fillColor: '#BBB', fillOpacity: 0.12, dashArray: '4,3' };
  }
  const color = planosColorPoligono(p.cultivo_abrev);
  return { color: color, weight: 2, fillColor: color, fillOpacity: 0.5 };
}

function planosOnEachFeature(feature, layer) {
  const p = feature.properties;

  // Etiqueta permanente con el código del lote en el centro
  layer.bindTooltip(p.lote, {
    permanent: true,
    direction: 'center',
    className: 'lote-tooltip' + (p.es_agricola ? '' : ' no-agr')
  });

  // Hover: engrosar borde
  layer.on('mouseover', function () {
    this.setStyle({ weight: 4, fillOpacity: 0.7 });
    this.bringToFront();
  });
  layer.on('mouseout', function () {
    this.setStyle(estiloPoligonoPlano(feature));
  });

  // Click: si es agrícola, abrir modal del lote (misma lógica que la solapa Lotes)
  layer.on('click', function () {
    if (p.es_agricola) {
      openLoteModal(p.establecimiento, p.lote);
    }
  });
}

function planosMostrarEstab(nombre) {
  const s = PLANOS_STATE;
  if (!s.mapa) return;
  Object.values(s.layers).forEach(l => s.mapa.removeLayer(l));

  const stats = document.getElementById('planos-stats');
  if (nombre === 'ambos') {
    s.layers.La_Madrugada.addTo(s.mapa);
    s.layers.La_Rodesia.addTo(s.mapa);
    const bounds = s.layers.La_Madrugada.getBounds().extend(s.layers.La_Rodesia.getBounds());
    s.mapa.fitBounds(bounds, { padding: [30, 30] });
    const t = GEO_LA_MADRUGADA.features.filter(f => f.properties.es_agricola).length +
              GEO_LA_RODESIA.features.filter(f => f.properties.es_agricola).length;
    stats.textContent = t + ' lotes agrícolas · 2 establecimientos';
  } else {
    s.layers[nombre].addTo(s.mapa);
    s.mapa.fitBounds(s.layers[nombre].getBounds(), { padding: [30, 30] });
    const t = (nombre === 'La_Madrugada' ? GEO_LA_MADRUGADA : GEO_LA_RODESIA)
                .features.filter(f => f.properties.es_agricola).length;
    stats.textContent = t + ' lotes agrícolas';
  }
}

function planosCrearLeyenda() {
  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'leaflet-control planos-legend');
    const cultivosUsados = new Set();
    [GEO_LA_MADRUGADA, GEO_LA_RODESIA].forEach(g => g.features.forEach(f => {
      if (f.properties.es_agricola && f.properties.cultivo_abrev) {
        cultivosUsados.add(f.properties.cultivo_abrev);
      }
    }));
    let html = '<h4>Cultivo 26-27</h4>';
    Array.from(cultivosUsados).sort().forEach(c => {
      const color = planosColorPoligono(c);
      const nombre = planosCultivoNombre(c);
      html += `<div class="legend-item"><div class="legend-color" style="background:${color}"></div><span>${nombre}</span></div>`;
    });
    html += `<div class="legend-item"><div class="legend-color no-agr" style="background:#BBB;opacity:0.4"></div><span style="color:#666;font-style:italic">No agrícola</span></div>`;
    div.innerHTML = html;
    return div;
  };
  return legend;
}

function initPlanosMapa() {
  const s = PLANOS_STATE;
  if (s.initialized) return;
  s.initialized = true;

  if (typeof L === 'undefined') {
    document.getElementById('planos-mapa').innerHTML =
      '<div style="padding:40px;text-align:center;color:var(--ink-3);font-style:italic">No se pudo cargar el mapa. Verificá tu conexión a internet.</div>';
    return;
  }

  s.mapa = L.map('planos-mapa', { scrollWheelZoom: true, preferCanvas: false });

  // Fondo satelital de Esri (gratis, sin API key)
  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
      maxZoom: 19,
      attribution: 'Tiles © Esri, Maxar, Earthstar Geographics'
    }
  ).addTo(s.mapa);

  // Cargar capas
  s.layers.La_Madrugada = L.geoJSON(GEO_LA_MADRUGADA, {
    style: estiloPoligonoPlano,
    onEachFeature: planosOnEachFeature
  });
  s.layers.La_Rodesia = L.geoJSON(GEO_LA_RODESIA, {
    style: estiloPoligonoPlano,
    onEachFeature: planosOnEachFeature
  });

  // Leyenda
  planosCrearLeyenda().addTo(s.mapa);

  // Selector
  const sel = document.getElementById('planos-est-selector');
  sel.addEventListener('change', e => planosMostrarEstab(e.target.value));

  // Botón de ubicación
  const locBtn = document.getElementById('planos-loc-btn');
  if (locBtn) locBtn.addEventListener('click', toggleUserLocation);

  // Vista inicial: La Madrugada
  planosMostrarEstab('La_Madrugada');

  // Forzar redibujado (a veces el mapa arranca chico si el contenedor recién se mostró)
  setTimeout(() => s.mapa.invalidateSize(), 200);
}

// =============== Ubicación del usuario en tiempo real ===============
const USER_LOC_STATE = {
  activo: false,
  watchId: null,
  marker: null,
  accuracyCircle: null,
  recenterCtrl: null,
  yaCentro: false  // solo centrar la primera vez
};

function toggleUserLocation() {
  const btn = document.getElementById('planos-loc-btn');
  const state = USER_LOC_STATE;

  if (state.activo) {
    // Desactivar
    detenerUserLocation();
    return;
  }

  // Verificar disponibilidad
  if (!('geolocation' in navigator)) {
    setLocBtnState('error', 'GPS no disponible');
    setTimeout(() => setLocBtnState('off'), 3000);
    return;
  }

  // Pedir permiso e iniciar tracking
  setLocBtnState('buscando', 'Buscando…');
  state.watchId = navigator.geolocation.watchPosition(
    onUserLocationUpdate,
    onUserLocationError,
    {
      enableHighAccuracy: true,
      maximumAge: 3000,
      timeout: 20000
    }
  );
  state.activo = true;
}

function onUserLocationUpdate(pos) {
  const state = USER_LOC_STATE;
  const s = PLANOS_STATE;
  if (!s.mapa) return;

  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const acc = pos.coords.accuracy || 30;

  setLocBtnState('activo', 'Ubicación activa');

  // Crear o mover el marker
  if (!state.marker) {
    const icon = L.divIcon({
      className: 'user-location-icon',
      html: '<div class="user-location-marker"><div class="pulse"></div><div class="dot"></div></div>',
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });
    state.marker = L.marker([lat, lon], { icon: icon, interactive: false, keyboard: false, zIndexOffset: 1000 }).addTo(s.mapa);
    state.accuracyCircle = L.circle([lat, lon], {
      radius: acc,
      color: '#2A6BB2',
      weight: 1,
      fillColor: '#2A6BB2',
      fillOpacity: 0.08,
      interactive: false
    }).addTo(s.mapa);

    // Agregar botón "recentrar" al mapa
    agregarBotonRecentrar();

    // Centrar solo la primera vez
    if (!state.yaCentro) {
      state.yaCentro = true;
      s.mapa.setView([lat, lon], Math.max(s.mapa.getZoom(), 16));
    }
  } else {
    state.marker.setLatLng([lat, lon]);
    state.accuracyCircle.setLatLng([lat, lon]);
    state.accuracyCircle.setRadius(acc);
  }
}

function onUserLocationError(err) {
  const state = USER_LOC_STATE;
  console.error('Error de geolocalización:', err);
  let msg = 'Error GPS';
  if (err.code === 1) msg = 'Permiso denegado';
  else if (err.code === 2) msg = 'Posición no disponible';
  else if (err.code === 3) msg = 'Tiempo agotado';

  setLocBtnState('error', msg);
  detenerUserLocation(false);
  // Volver a estado off después de mostrar el error
  setTimeout(() => setLocBtnState('off'), 4000);
}

function detenerUserLocation(volverAOff = true) {
  const state = USER_LOC_STATE;
  const s = PLANOS_STATE;
  if (state.watchId !== null) {
    navigator.geolocation.clearWatch(state.watchId);
    state.watchId = null;
  }
  if (state.marker && s.mapa) {
    s.mapa.removeLayer(state.marker);
    state.marker = null;
  }
  if (state.accuracyCircle && s.mapa) {
    s.mapa.removeLayer(state.accuracyCircle);
    state.accuracyCircle = null;
  }
  if (state.recenterCtrl && s.mapa) {
    s.mapa.removeControl(state.recenterCtrl);
    state.recenterCtrl = null;
  }
  state.activo = false;
  state.yaCentro = false;
  if (volverAOff) setLocBtnState('off');
}

function setLocBtnState(estado, texto) {
  const btn = document.getElementById('planos-loc-btn');
  if (!btn) return;
  btn.classList.remove('buscando', 'activo', 'error');
  const textEl = btn.querySelector('.planos-loc-text');
  if (estado === 'off') {
    if (textEl) textEl.textContent = 'Mi ubicación';
    btn.title = 'Activar mi ubicación en tiempo real';
  } else if (estado === 'buscando') {
    btn.classList.add('buscando');
    if (textEl) textEl.textContent = texto || 'Buscando…';
  } else if (estado === 'activo') {
    btn.classList.add('activo');
    if (textEl) textEl.textContent = texto || 'Ubicación activa';
    btn.title = 'Tocá para desactivar';
  } else if (estado === 'error') {
    btn.classList.add('error');
    if (textEl) textEl.textContent = texto || 'Error';
  }
}

function agregarBotonRecentrar() {
  const state = USER_LOC_STATE;
  const s = PLANOS_STATE;
  if (state.recenterCtrl) return;

  const RecenterControl = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      const div = L.DomUtil.create('div', 'leaflet-control planos-recenter');
      div.innerHTML = '📍';
      div.title = 'Centrar en mi ubicación';
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.on(div, 'click', function () {
        if (state.marker) {
          s.mapa.setView(state.marker.getLatLng(), Math.max(s.mapa.getZoom(), 16));
        }
      });
      return div;
    }
  });
  state.recenterCtrl = new RecenterControl();
  state.recenterCtrl.addTo(s.mapa);
}
</script>
